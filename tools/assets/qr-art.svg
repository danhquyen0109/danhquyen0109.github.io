<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c2c2"/>
      <stop offset="1" stop-color="#0c7d86"/>
    </linearGradient>
    <!-- Lưới ô vuông thưa gợi hình mã QR, để rất mờ cho khỏi chọi với sprite ở giữa. -->
    <pattern id="cells" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="14" height="14" rx="3" fill="#fff" opacity=".13"/>
      <rect x="24" y="22" width="9" height="9" rx="2" fill="#fff" opacity=".10"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <rect width="640" height="360" fill="url(#cells)"/>
  <g fill="none" stroke="#fff" stroke-width="9" opacity=".16">
    <rect x="34" y="34" width="74" height="74" rx="14"/>
    <rect x="532" y="252" width="74" height="74" rx="14"/>
  </g>
</svg>
