<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f8ff5"/>
      <stop offset=".6" stop-color="#b7a6f2"/>
      <stop offset="1" stop-color="#d7c4ef"/>
    </linearGradient>
    <!-- Vạch chéo gợi cảm giác dòng dữ liệu đang chảy từ đuôi này sang đuôi khác. -->
