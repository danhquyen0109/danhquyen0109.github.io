<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Admin — Shopee</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Bảng điều khiển quản lý tiếp thị liên kết Shopee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2319c2c2'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='%23063' font-family='Arial' font-weight='bold'>A</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===================== Màn hình chờ ===================== -->
<div id="boot" class="boot">
  <div class="boot-mark">A</div>
  <p>Đang tải…</p>
</div>

<!-- ===================== Màn hình đăng nhập ===================== -->
<div id="auth" class="auth" hidden>
  <form class="auth-card" id="login-form" autocomplete="on">
    <div class="auth-mark">A</div>
    <h1>Affiliate Admin</h1>
    <p class="auth-sub">Bảng điều khiển tiếp thị liên kết Shopee</p>

    <label class="field">
      <span>Email</span>
      <input type="email" name="email" required autocomplete="username" placeholder="ban@email.com">
    </label>

    <label class="field">
      <span>Mật khẩu</span>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </label>

    <div class="auth-error" id="auth-error" hidden></div>

    <button type="submit" class="btn btn-block" id="login-btn">Đăng nhập</button>

    <button type="button" class="btn-link" id="forgot-btn">Quên mật khẩu?</button>
  </form>
</div>

<!-- ===================== Ứng dụng ===================== -->
<div id="app" class="app" hidden>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/dashboard">
      <span class="brand-mark">A</span>
      <span class="brand-text">
        <strong>Affiliate</strong>
        <small>Shopee</small>
      </span>
    </a>

    <nav class="nav">
      <a href="#/dashboard" data-route="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
        Tổng quan
      </a>
      <a href="#/products" data-route="products">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.5 3.6L12 11.5 5.5 7.9 12 4.3ZM5 9.6l6 3.4v6.5l-6-3.3V9.6Zm8 9.9V13l6-3.4v6.6l-6 3.3Z"/></svg>
        Sản phẩm &amp; Link
      </a>
      <a href="#/orders" data-route="orders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l1 2h3v2h-1.1l-1.5 12.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8L4.1 8H3V6h3l1-2Zm-.9 4 1.4 12h9l1.4-12H6.1ZM10 10h2v8h-2v-8Zm4 0h2v8h-2v-8Z"/></svg>
        Đơn hàng
      </a>
      <a href="#/briefs" data-route="briefs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1.5V8h4.5L14 3.5ZM8 12h8v2H8v-2Zm0 4h8v2H8v-2Z"/></svg>
        Brief cho agent
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm9-2c0-.6-.1-1.2-.2-1.8l2-1.5-2-3.4-2.3 1a8 8 0 0 0-3-1.8L15 2H9l-.5 2.5a8 8 0 0 0-3 1.7l-2.3-1-2 3.5 2 1.5a8.4 8.4 0 0 0 0 3.6l-2 1.5 2 3.4 2.3-1a8 8 0 0 0 3 1.8L9 22h6l.5-2.5a8 8 0 0 0 3-1.7l2.3 1 2-3.5-2-1.5c.1-.6.2-1.2.2-1.8Z"/></svg>
        Cài đặt
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="who">
        <span class="who-avatar" id="who-avatar">?</span>
        <span class="who-mail" id="who-mail">—</span>
      </div>
      <button class="btn-ghost btn-sm" id="logout-btn">Đăng xuất</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
      </button>
      <h1 id="page-title">Tổng quan</h1>
      <div class="topbar-actions" id="page-actions"></div>
    </header>

    <div class="content" id="view"></div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
</div>

<!-- ===================== Overlay dùng chung ===================== -->
<div class="modal-root" id="modal-root" hidden></div>
<div class="toast-stack" id="toast-stack"></div>

<script type="module" src="js/app.js"></script>
<noscript>
  <p style="padding:32px;font-family:sans-serif">Trang này cần JavaScript để hoạt động.</p>
</noscript>
</body>
</html>
