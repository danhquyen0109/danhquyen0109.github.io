<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A 2048 board of coloured number tiles">
  <rect width="640" height="360" fill="#e9e9e7"/>
  <rect x="100" y="-40" width="440" height="440" rx="26" fill="#dcdcd9"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">
    <!-- row 1 -->
    <rect x="114" y="-26" width="92.5" height="92.5" rx="12" fill="#d9f4f6"/><text x="160" y="20" font-size="34" fill="#0c7d86">2</text>
    <rect x="220.5" y="-26" width="92.5" height="92.5" rx="12" fill="#b8e9ee"/><text x="267" y="20" font-size="34" fill="#0c7d86">4</text>
    <rect x="327" y="-26" width="92.5" height="92.5" rx="12" fill="#7fd9e2"/><text x="373" y="20" font-size="34" fill="#064c56">8</text>
    <rect x="433.5" y="-26" width="92.5" height="92.5" rx="12" fill="#4bc9d6"/><text x="480" y="20" font-size="32" fill="#ffffff">16</text>
    <!-- row 2 -->
    <rect x="114" y="80.5" width="92.5" height="92.5" rx="12" fill="#19c2c2"/><text x="160" y="127" font-size="32" fill="#ffffff">32</text>
    <rect x="220.5" y="80.5" width="92.5" height="92.5" rx="12" fill="#0fa2ab"/><text x="267" y="127" font-size="32" fill="#ffffff">64</text>
    <rect x="327" y="80.5" width="92.5" height="92.5" rx="12" fill="#f7cd63"/><text x="373" y="127" font-size="27" fill="#4a3608">128</text>
    <rect x="433.5" y="80.5" width="92.5" height="92.5" rx="12" fill="#f2ae3c"/><text x="480" y="127" font-size="27" fill="#ffffff">256</text>
    <!-- row 3 -->
    <rect x="114" y="187" width="92.5" height="92.5" rx="12" fill="#ec8c2b"/><text x="160" y="233" font-size="27" fill="#ffffff">512</text>
    <rect x="220.5" y="187" width="92.5" height="92.5" rx="12" fill="#e46a24"/><text x="267" y="233" font-size="21" fill="#ffffff">1024</text>
    <rect x="327" y="187" width="92.5" height="92.5" rx="12" fill="#ececea"/>
    <rect x="433.5" y="187" width="92.5" height="92.5" rx="12" fill="#d9f4f6"/><text x="480" y="233" font-size="34" fill="#0c7d86">2</text>
    <!-- row 4 -->
    <rect x="114" y="293.5" width="92.5" height="92.5" rx="12" fill="#ececea"/>
    <rect x="220.5" y="293.5" width="92.5" height="92.5" rx="12" fill="#7fd9e2"/><text x="267" y="330" font-size="34" fill="#064c56">8</text>
    <rect x="327" y="293.5" width="92.5" height="92.5" rx="12" fill="#0fa2ab"/><text x="373" y="330" font-size="32" fill="#ffffff">64</text>
    <rect x="433.5" y="293.5" width="92.5" height="92.5" rx="12" fill="#ececea"/>
