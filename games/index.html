<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Vui</title>
<meta name="description" content="Free browser games by Quyen Pham. No install, no sign-up — just click and play.">
<meta name="theme-color" content="#e9e9e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>Q</text></svg>">
<style>
  :root{
    --bg:#e9e9e7;
    --surface:#ffffff;
    --ink:#141414;
    --muted:#6b6b6b;
    --teal:#19c2c2;
    --teal-soft:#d9f4f6;
    --teal-ink:#0c7d86;
    --radius-lg:28px;
    --radius-md:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:1240px;
    margin:0 auto;
    background:var(--surface);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }

  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:22px 36px;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    border:2.5px solid var(--ink);
    display:grid;place-items:center;
    font-weight:800;font-size:16px;
  }
  .brand .name{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:#fff;
    border:none;border-radius:999px;
    padding:12px 24px;
    font-family:inherit;font-size:14px;font-weight:600;
    text-decoration:none;cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:.85}

  /* ===== Hero ===== */
  .hero{
    padding:26px 36px 40px;
    border-bottom:1px solid #eee;
  }
  .eyebrow{
    display:inline-block;
    background:var(--teal-soft);color:var(--teal-ink);
    font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:7px 14px;border-radius:999px;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(34px,6vw,60px);
    font-weight:900;line-height:1.05;letter-spacing:-.02em;
    max-width:16ch;
  }
  .hero h1 em{font-style:normal;color:var(--teal-ink)}
  .hero p{
    margin-top:16px;color:var(--muted);
    font-size:16px;line-height:1.6;max-width:52ch;
  }

  /* ===== Grid ===== */
  .section{padding:36px}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin-bottom:22px;flex-wrap:wrap;
  }
  .section-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .section-head span{font-size:13px;color:var(--muted)}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
  }

  .card{
    display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid #ececec;
    border-radius:var(--radius-md);
    overflow:hidden;
    text-decoration:none;color:inherit;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 34px rgba(0,0,0,.11);
    border-color:#dcdcdc;
  }

  .thumb{
    position:relative;
    aspect-ratio:16/9;
    background-size:cover;background-position:center;
    display:grid;place-items:center;
    overflow:hidden;
  }
  /* Pale sky art swallows a pale sprite — a soft vignette gives it something to sit on. */
  .thumb::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at center,rgba(10,30,45,.30) 0%,rgba(10,30,45,.05) 55%,rgba(10,30,45,.22) 100%);
  }
  .thumb .tag,.thumb .sprite,.thumb .placeholder{position:relative;z-index:1}
  .thumb .sprite{
    width:34%;max-width:130px;height:auto;
    image-rendering:pixelated;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.28));
    transition:transform .25s ease;
  }
  .card:hover .thumb .sprite{transform:translateY(-6px) rotate(-6deg) scale(1.06)}
  .thumb .tag{
    position:absolute;top:12px;left:12px;
    background:rgba(20,20,20,.82);color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 11px;border-radius:999px;
    backdrop-filter:blur(4px);
  }

  .card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-body h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .card-body p{font-size:14px;line-height:1.55;color:var(--muted);flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{
    font-size:11px;font-weight:600;
    background:#f4f4f3;color:#555;
    padding:5px 10px;border-radius:999px;
  }
  .play-line{
    display:flex;align-items:center;gap:7px;
    margin-top:10px;
    font-size:13px;font-weight:700;color:var(--teal-ink);
  }
  .play-line svg{transition:transform .18s ease}
  .card:hover .play-line svg{transform:translateX(4px)}

  /* Soon card */
  .card.soon{
    border-style:dashed;background:#fbfbfa;cursor:default;
  }
  .card.soon:hover{transform:none;box-shadow:none;border-color:#ececec}
  .card.soon .thumb{
    background:repeating-linear-gradient(45deg,#f3f3f2,#f3f3f2 12px,#ededec 12px,#ededec 24px);
  }
  .card.soon .thumb .placeholder{
    font-size:34px;opacity:.35;
  }

  footer{
    padding:26px 36px 34px;
    border-top:1px solid #eee;
    display:flex;justify-content:space-between;align-items:center;
    gap:14px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);
  }
  footer a{color:var(--ink);text-decoration:none;font-weight:600}
  footer a:hover{color:var(--teal-ink)}

  @media (max-width:640px){
    header{padding:18px 20px}
    .hero{padding:20px 20px 30px}
    .section{padding:26px 20px}
    footer{padding:22px 20px 28px}
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <a class="brand" href="../">
      <span class="mark">Q</span>
      <span class="name">Danh Quyen</span>
    </a>
    <a class="btn" href="../">Portfolio</a>
  </header>

  <section class="hero">
    <span class="eyebrow">Arcade</span>
    <h1>Small games, <em>zero install.</em></h1>
    <p>A shelf of browser games I build for fun. They run straight in the tab — desktop or phone, keyboard or thumb. Pick one and play.</p>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>All games</h2>
      <span id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <span>&copy; <span id="year"></span> Pham Danh Quyen</span>
  </footer>

</div>

<script>
/* Add a new game by appending one entry here. */
const GAMES = [
  {
    slug: 'sky-dash',
    title: 'Sky Dash',
    tag: 'New',
    blurb: 'One tap keeps you airborne. Thread the rock gaps, grab the gold stars, and see how far the little plane gets before gravity wins.',
    chips: ['Arcade', 'One-tap', 'Endless'],
    art: 'sky-dash/assets/sprites/background.png',
    sprite: 'sky-dash/assets/sprites/planes/planeRed1.png',
  },
];

const grid = document.getElementById('grid');
const arrow = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

grid.innerHTML = GAMES.map(g => `
  <a class="card" href="${g.slug}/">
    <div class="thumb" style="background-image:url('${g.art}')">
      ${g.tag ? `<span class="tag">${g.tag}</span>` : ''}
      <img class="sprite" src="${g.sprite}" alt="" loading="lazy">
    </div>
    <div class="card-body">
      <h3>${g.title}</h3>
      <p>${g.blurb}</p>
      <div class="chips">${g.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>
      <span class="play-line">Play now ${arrow}</span>
    </div>
  </a>
`).join('') + `
  <div class="card soon">
    <div class="thumb"><span class="placeholder">&#127918;</span></div>
    <div class="card-body">
      <h3>More on the way</h3>
      <p>Another game is in the workshop. Check back soon.</p>
      <div class="chips"><span class="chip">Coming soon</span></div>
    </div>
  </div>`;

document.getElementById('count').textContent =
  GAMES.length + (GAMES.length === 1 ? ' game live' : ' games live');
document.getElementById('year').textContent = new Date().getFullYear();

/* Folder links like "sky-dash/" keep index.html out of the published URL — a web
   server (GitHub Pages included) serves the directory index automatically. Opening
   the page straight off disk has no such server, so file:// would show a directory
   listing instead. Point those links at the file explicitly, in that case only. */
if (location.protocol === 'file:') {
  document.querySelectorAll('a[href$="/"]').forEach(a =>
    a.setAttribute('href', a.getAttribute('href') + 'index.html'));
}
</script>
</body>
</html>
